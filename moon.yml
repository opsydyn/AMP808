# ADR-0021: These workspace-level tasks mirror the authoritative Cargo gates.
language: rust
layer: application

env:
  CARGO_TERM_COLOR: always

fileGroups:
  sources:
    - 'apps/tui/src/**/*'
    - 'apps/web/src/**/*'
    - 'apps/*/Cargo.toml'
    - 'crates/*/src/**/*'
    - 'crates/*/Cargo.toml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
  desktopSources:
    - 'apps/desktop/assets/**/*'
    - 'apps/desktop/build.rs'
    - 'apps/desktop/macos/**/*'
    - 'apps/desktop/src/**/*'
    - 'apps/desktop/tests/**/*'
    - 'apps/desktop/Cargo.toml'
    - 'crates/*/src/**/*'
    - 'crates/*/Cargo.toml'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'
  tests:
    - 'apps/*/tests/**/*'
    - 'crates/*/tests/**/*'
  cargoConfig:
    - '.cargo/config*'
    - '$CARGO_BUILD_TARGET'
    - '$CARGO_BUILD_RUSTFLAGS'
    - '$CARGO_ENCODED_RUSTFLAGS'
    - '$RUSTFLAGS'
    - '$RUSTC'
    - '$RUSTC_WRAPPER'
    - '$RUSTC_WORKSPACE_WRAPPER'
    - '$CC'
    - '$CFLAGS'
    - '$PKG_CONFIG_PATH'
    - '$PKG_CONFIG_LIBDIR'
    - '$OPENSSL_DIR'
  release:
    - '.github/workflows/release.yml'
    - 'release-plz.toml'
    - 'scripts/check-release-gate.sh'
  workspaceLayout:
    - 'Cargo.toml'
    - 'apps/*/Cargo.toml'
    - 'crates/*/Cargo.toml'
    - 'scripts/check-workspace-layout.sh'

tasks:
  layout:
    command: 'bash scripts/check-workspace-layout.sh'
    inputs:
      - '@group(workspaceLayout)'
  build:
    command: 'cargo build --locked'
    options:
      cache: false
    inputs:
      - '@group(sources)'
  check:
    command: 'cargo check --locked'
    inputs:
      - '@group(sources)'
  check-web:
    command: 'cargo check --locked -p amp808_web --target wasm32-unknown-unknown'
    inputs:
      - '@group(sources)'
  desktop-check:
    command: 'cargo check --locked -p amp808-r3tr0'
    inputs:
      - '@group(desktopSources)'
    options:
      runInCI: false
  desktop-apple-config-check:
    command: 'bash scripts/check-apple-music-bundle-config.sh'
    inputs:
      - 'apps/desktop/macos/Info.plist'
      - 'apps/desktop/macos/AMP808-R3TR0.entitlements'
      - 'scripts/check-apple-music-bundle-config.sh'
    options:
      runInCI: false
  desktop-test:
    command: 'cargo test --locked -p amp808-r3tr0'
    inputs:
      - '@group(desktopSources)'
    options:
      runInCI: false
  desktop-lint:
    command: 'cargo clippy --locked -p amp808-r3tr0 --tests -- -D warnings'
    inputs:
      - '@group(desktopSources)'
    options:
      runInCI: false
  desktop-build-macos:
    command: 'cargo build --locked -p amp808-r3tr0'
    inputs:
      - '@group(desktopSources)'
    options:
      cache: false
      runInCI: false
  desktop-milkdrop-test-macos:
    command: 'cargo test --locked -p amp808-r3tr0 --features milkdrop-projectm'
    inputs:
      - '@group(desktopSources)'
    options:
      runInCI: false
  desktop-milkdrop-lint-macos:
    command: 'cargo clippy --locked -p amp808-r3tr0 --tests --features milkdrop-projectm -- -D warnings'
    inputs:
      - '@group(desktopSources)'
    options:
      runInCI: false
  format:
    command: 'cargo fmt --all --check'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'apps/desktop/src/**/*'
      - 'apps/desktop/build.rs'
      - 'file://rustfmt.toml?optional'
      - 'file://.rustfmt.toml?optional'
    checks:
      - check: fingerprint
        script: 'cargo fmt --version'
  lint:
    command: 'cargo clippy --all-targets --locked -- -D warnings'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(cargoConfig)'
      - 'file://clippy.toml?optional'
      - 'file://.clippy.toml?optional'
      - '$CARGO_PROFILE_*'
      - '$CARGO_TARGET_*'
    checks:
      - check: fingerprint
        script: 'rustc --version --verbose'
      - check: fingerprint
        script: 'cargo clippy --version'
      - check: fingerprint
        script: 'pkg-config --modversion alsa openssl'
  test:
    command: 'cargo test --locked'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(cargoConfig)'
      - '$CARGO_PROFILE_*'
      - '$CARGO_TARGET_*'
    checks:
      - check: fingerprint
        script: 'rustc --version --verbose'
      - check: fingerprint
        script: 'pkg-config --modversion alsa openssl'
  nextest:
    command: 'cargo nextest run --locked'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(cargoConfig)'
      - '.config/nextest.toml'
      - '$CARGO_PROFILE_*'
      - '$CARGO_TARGET_*'
    checks:
      - check: fingerprint
        script: 'rustc --version --verbose'
      - check: fingerprint
        script: 'cargo nextest --version'
      - check: fingerprint
        script: 'pkg-config --modversion alsa openssl'
  release-gate:
    command: 'bash scripts/check-release-gate.sh'
    options:
      cache: false
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '@group(release)'
