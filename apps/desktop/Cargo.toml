[package]
name = "amp808-r3tr0"
version = "0.1.0"
edition = "2024"
publish = false
description = "AMP808-R3TR0 macOS-first desktop music player."
license = "MIT"

[features]
milkdrop-projectm = [
    "dep:libc",
    "dep:projectm-sys",
    "dep:raw-window-handle",
]
milkdrop-test-hooks = ["milkdrop-projectm"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
amp808-core = { path = "../../crates/amp808-core" }
cpal = "0.18"
dirs = "6"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
realfft = "3"
rtrb = "0.3"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
symphonia = { version = "0.6", features = ["all", "opt-simd"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-graphics-types = "0.2"
libc = { version = "0.2", optional = true }
metal = "0.33"
objc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }
projectm-sys = { version = "1.2.2", optional = true, default-features = false, features = ["static"] }
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "test-support"] }
tempfile = "3"
